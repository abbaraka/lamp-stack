# Milena Host - Nginx Virtual Host Configuration
# Version: 1.0 
# Note: HTTP Only

server {
   listen 80;
   listen [::]:80;

   # Replace <your_server_name> with your actual server name
   server_name <your_server_name>;

   # Replace <your_web_root> with your actual web root
   root <your_web_root>;

   index index.php index.html;

   # Logging
   access_log /var/log/nginx/milena-access.log;
   error_log /var/log/nginx/milena-error.log;

   # Main location block
   location / {
      try_files $uri $uri/ =404;
   }

   # PHP-FPM configuration
   location ~ \.php$ {
      include snippets/fastcgi-php.conf;
      # Replace 8.3 with your PHP version if different
      fastcgi_pass unix:/run/php/php8.3-fpm.sock;
   }

   # Deny access to hidden files
   location ~ /\.ht {
      deny all;
   }

   # Deny access to sensitive files
   location ~ \.(sql|bak|backup|env)$ {
      deny all;
   }
}
